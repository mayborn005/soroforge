# actionlint validates GitHub Actions workflow files for syntax errors,
# invalid ${{ }} expressions, runner labels, and action inputs/outputs.
# It runs on pull requests and pushes to main that touch workflows to catch
# mistakes before workflows run on schedule or after release.
name: Actionlint

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  pull_request:
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download actionlint
        shell: bash
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12

      - name: Run actionlint
        shell: bash
        run: ./actionlint -color
